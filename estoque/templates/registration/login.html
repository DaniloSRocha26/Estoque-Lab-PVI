{% extends "estoque/base.html" %}
{% block titulo %}Entrar · Controle de Toner{% endblock %}
{% block conteudo %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card card-body mt-4">
      <h1 class="h5 mb-3"><i class="bi bi-person-lock"></i> Entrar</h1>
      {% if form.errors %}<div class="alert alert-danger py-2 small">Usuário ou senha incorretos.</div>{% endif %}
      <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <div class="mb-3"><label class="form-label small mb-0" for="id_username">Usuário</label>
          <input class="form-control" id="id_username" name="username" autofocus autocomplete="username" required></div>
        <div class="mb-3"><label class="form-label small mb-0" for="id_password">Senha</label>
          <input class="form-control" id="id_password" type="password" name="password" autocomplete="current-password" required></div>
        <button class="btn btn-primary w-100">Entrar</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
