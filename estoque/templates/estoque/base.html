<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Controle de Toner{% endblock %}</title>
  <style>
    :root { --bg:#f4f5f7; --card:#fff; --texto:#1f2933; --suave:#6b7280; --borda:#e2e5ea;
            --ok:#2e9e5b; --medio:#e0a100; --baixo:#d64545; --azul:#2563eb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#14171c; --card:#1d2128; --texto:#e6e8eb; --suave:#9aa3af; --borda:#2c323b; }
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--texto); }
    header { background:var(--card); border-bottom:1px solid var(--borda); padding:12px 16px;
             display:flex; gap:20px; align-items:center; flex-wrap:wrap; }
    header h1 { font-size:18px; margin:0 12px 0 0; }
    header a { color:var(--azul); text-decoration:none; font-weight:500; }
    main { max-width:1100px; margin:0 auto; padding:16px; }
    h2 { font-size:16px; margin:24px 0 10px; }
    .grade { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:12px; }
    .card { background:var(--card); border:1px solid var(--borda); border-radius:8px; padding:14px; }
    .card h3 { margin:0 0 2px; font-size:16px; }
    .suave { color:var(--suave); font-size:13px; }
    .barra { background:var(--borda); border-radius:6px; height:14px; margin:10px 0 4px; overflow:hidden; }
    .barra > span { display:block; height:100%; }
    .ok { background:var(--ok); } .medio { background:var(--medio); } .baixo { background:var(--baixo); }
    form.linha { display:flex; gap:8px; flex-wrap:wrap; align-items:end; margin-top:10px; }
    label { font-size:12px; color:var(--suave); display:flex; flex-direction:column; gap:2px; }
    input, select, textarea { font:inherit; padding:5px 7px; border:1px solid var(--borda); border-radius:5px;
                              background:var(--bg); color:var(--texto); }
    input[type=number] { width:78px; }
    button { font:inherit; padding:6px 12px; border:0; border-radius:5px; background:var(--azul);
             color:#fff; cursor:pointer; }
    .alerta { border-left:4px solid var(--baixo); }
    .alerta.andamento { border-left-color:var(--medio); }
    table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--borda); }
    th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--borda); font-size:14px; }
    .msg { padding:8px 12px; border-radius:6px; margin-bottom:8px; background:var(--card);
           border:1px solid var(--borda); }
    .msg.error { border-color:var(--baixo); } .msg.success { border-color:var(--ok); }
    .abaixo { color:var(--baixo); font-weight:600; }
  </style>
</head>
<body>
  <header>
    <h1>Controle de Toner</h1>
    <a href="{% url 'painel' %}">Painel</a>
    <a href="{% url 'pedidos' %}">Pedidos</a>
    <a href="/admin/">Cadastros</a>
  </header>
  <main>
    {% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}
    {% block conteudo %}{% endblock %}
  </main>
</body>
</html>
