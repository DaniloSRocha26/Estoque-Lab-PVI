{% load static %}<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Controle de Toner{% endblock %}</title>
  <script>
    (function () {
      var salvo = null;
      try { salvo = localStorage.getItem('tema'); } catch (e) {}
      var tema = salvo || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-bs-theme', tema);
    })();
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'estoque/app.css' %}" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
  <nav class="navbar navbar-expand bg-body border-bottom sticky-top">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="{% url 'painel' %}">
        <i class="bi bi-printer-fill text-primary"></i> Controle de Toner
      </a>
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'painel' %}active{% endif %}" href="{% url 'painel' %}">Painel</a></li>
        <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'pedidos' %}active{% endif %}" href="{% url 'pedidos' %}">Pedidos</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin/">Cadastros</a></li>
      </ul>
      <button id="alternar-tema" class="btn btn-outline-secondary btn-sm" type="button" title="Alternar tema">
        <i class="bi bi-circle-half"></i>
      </button>
    </div>
  </nav>

  <main class="container py-4" id="conteudo">
    {% for m in messages %}<div class="d-none" data-mensagem="{{ m.tags }}">{{ m }}</div>{% endfor %}
    {% block conteudo %}{% endblock %}
  </main>

  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toasts"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'estoque/app.js' %}"></script>
</body>
</html>
